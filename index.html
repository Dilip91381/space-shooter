
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEBULA RUN — Space Shooter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-container">
    <header>
      <p class="eyebrow">THE GALAXY NEEDS YOU</p>
      <h1>NEBULA <span>RUN</span></h1>
      <p>Survive the swarm. Become a legend.</p>
    </header>

    <section class="stats">
      <div class="stat"><span class="stat-label">SCORE</span><strong id="score">0</strong></div>
      <div class="stat"><span class="stat-label">WAVE</span><strong id="wave">1</strong></div>
      <div class="stat"><span class="stat-label">LIVES</span><strong id="lives">3</strong></div>
      <div class="stat"><span class="stat-label">BEST</span><strong id="best">0</strong></div>
    </section>

    <div class="game-area">
      <canvas id="gameCanvas" width="800" height="600"></canvas>

      <div id="overlay" class="overlay">
        <div class="overlay-icon">✦</div>
        <p class="eyebrow">PILOT, YOUR SHIP IS READY</p>
        <h2 id="message">Ready for Battle?</h2>
        <p id="instructions">
          Arrow keys / WASD to fly · Space to fire<br>
          Collect ✦ rapid fire and ♥ extra lives
        </p>
        <button id="startBtn">LAUNCH MISSION <span>↗</span></button>
      </div>
    </div>

    <div class="mobile-controls">
      <button data-key="ArrowLeft">◀</button>
      <button data-key="ArrowUp">▲</button>
      <button data-key="ArrowDown">▼</button>
      <button data-key="ArrowRight">▶</button>
      <button id="fireBtn">🔥 FIRE</button>
    </div>

    <p class="footer">Destroy enemies. Protect your ship. Save the galaxy!</p>
  </main>

  <script src="scrpit.js"></script>
</body>
</html>
